# Provider catalog seed only. Routing/privacy/quota apply to discovered Inference Deployments,
# not to a provider brand globally. Runtime discovery persists account/tier/endpoint-specific truth.
providers:
  openrouter:
    enabled: false
    discovery_adapter: openrouter
    quota_adapter: openrouter
  groq:
    enabled: false
    discovery_adapter: groq
    quota_adapter: groq
  gemini:
    enabled: false
    discovery_adapter: gemini
    quota_adapter: gemini
  sambanova:
    enabled: false
    discovery_adapter: sambanova
    quota_adapter: sambanova
  mistral:
    enabled: false
    discovery_adapter: generic
    quota_adapter: generic
  nvidia_nim:
    enabled: false
    discovery_adapter: generic
    quota_adapter: generic
  cloudflare_workers_ai:
    enabled: false
    discovery_adapter: cloudflare
    quota_adapter: generic
  huggingface:
    enabled: false
    discovery_adapter: huggingface
    quota_adapter: generic
  ollama:
    enabled: false
    discovery_adapter: local
    quota_adapter: local

inference_deployment_defaults:
  enabled: false
  privacy_class: public_only
  cost_class: unknown
  promotional_capacity_is_durable: false
  unknown_terms_block_non_public_data: true
  probationary_until_smoke_tested: true
