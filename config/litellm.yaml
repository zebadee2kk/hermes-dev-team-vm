# Bootstrap config only. Forge owns deployment eligibility and exact placement.
# Runtime model_list entries are generated by forge_controller.litellm_config after
# Inference Deployments pass policy, quota, terms and capability gates.
model_list: []

router_settings:
  num_retries: 1
  retry_after: 1
  allowed_fails: 2
  cooldown_time: 60

# LiteLLM handles request-level retries/cooldowns. Long-lived quota/reset truth belongs to
# Forge Quota Intelligence so exhausted deployments are not hammered repeatedly.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  drop_params: true
  set_verbose: false
