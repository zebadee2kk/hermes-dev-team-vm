# Stable Hermes profile identity -> stable Forge model alias.
# The alias is resolved by Forge at request time; Hermes never binds itself to a provider deployment.
lanes:
  forge-orchestrator:
    model: forge/reasoning
    description: Owns root intent, decomposition, coordination, synthesis and material escalation.
  research:
    model: forge/research
    description: Collects evidence, performs research and records provenance/reality anchors.
  product:
    model: forge/reasoning
    description: Refines requirements, acceptance criteria and user-value constraints.
  architecture:
    model: forge/reasoning
    description: Owns architecture, interfaces, tradeoffs and impact analysis.
  engineering:
    model: forge/coding
    description: Implements, debugs and integrates scoped engineering tasks.
  security:
    model: forge/review
    description: Performs threat modelling, security review and capability-boundary checks.
  qa-review:
    model: forge/review
    description: Independently verifies acceptance criteria, tests and reality anchors.
  documentation-release:
    model: forge/documentation
    description: Produces documentation, packaging, handover and release preparation.

hermes:
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  api_key_ref: ${FORGE_GATEWAY_KEY}
  api_mode: chat_completions
  disable_direct_provider_fallbacks: true
  kanban:
    dispatch_in_gateway: true
    orchestrator_profile: forge-orchestrator
    default_assignee: engineering
