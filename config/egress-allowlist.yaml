# Bootstrap destination registry — NOT an authorisation/trust list.
# Sensitive operations require config/capability-policy.yaml and trusted credential injection.
# Workers should normally reach these through the Capability Gateway rather than direct broad egress.
destinations:
  github:
    domains: [github.com, api.github.com, raw.githubusercontent.com]
    default_capability: none
  python_packages:
    domains: [pypi.org, files.pythonhosted.org]
    default_capability: package_registry_read
  npm_packages:
    domains: [registry.npmjs.org]
    default_capability: package_registry_read
  container_registry:
    domains: [registry-1.docker.io, auth.docker.io]
    default_capability: package_registry_read
  documentation:
    domains: [docs.python.org, developer.mozilla.org, learn.microsoft.com]
    default_capability: public_web_research

rules:
  domain_match_does_not_authorize_credentials_or_write: true
  llm_confidence_cannot_auto_authorize: true
  auto_add_requires_deterministic_pre_authorized_trust_chain: true
  prohibit_private_link_local_metadata_by_network_policy: true
