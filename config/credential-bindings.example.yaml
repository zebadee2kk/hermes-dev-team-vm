version: 1
bindings:
  # Non-secret metadata only. The actual credential named below is supplied to the
  # trusted service through systemd LoadCredential= and is never stored here.
  - binding_id: trusted_gateway
    service: github
    operations: [branch.push, pr.create]
    credential_name: github-app-private-key
    resources:
      - zebadee2kk/hermes-dev-team-vm
    max_bytes: 65536
