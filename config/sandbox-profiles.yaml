profiles:
  low:
    intended_for: trusted-low-risk
    runtime: not_implemented
    enabled: false
    docker_socket: never
    network: none
    note: Do not silently fall back to ordinary runc until a low-risk isolation ADR exists.
  normal:
    intended_for: autonomous-arbitrary-project-code
    runtime: gvisor
    runtime_name: runsc
    enabled: true
    allow_root_inside: false
    user: "65532:65532"
    image_digest_required: true
    read_only_rootfs: true
    cap_drop: [ALL]
    no_new_privileges: true
    docker_socket: never
    network: none
    workspace_mounts: task_scoped_only
    limits:
      cpus: 2
      memory_mb: 4096
      pids: 256
      tmpfs_mb: 512
      timeout_seconds: 1800
  high:
    intended_for: hostile-high-risk-or-client-policy
    runtime: not_implemented
    target_runtime: vm_or_microvm
    enabled: false
    docker_socket: never
    network: none
    note: Fail closed until the stronger isolation backend is implemented and tested.

future_capability_gateway:
  enabled: false
  principle: no direct worker internet; operation/resource scoped egress only

hard_denies:
  - host_docker_socket
  - host_containerd_socket
  - control_plane_secrets
  - control_plane_database_admin
  - cloud_metadata
  - host_root_namespace
  - host_devices
  - policy_files_write
  - arbitrary_host_mounts
  - direct_worker_internet
