version: 2

layers:
  raw:
    immutable: true
    grounding_authority: true
    requires_trust_envelope: true
    shared_global_sensitivity: PUBLIC
  proposals:
    derivative_only: true
    external_content_never_auto_compiles: true
    injection_findings_force_quarantine: true
  wiki:
    llm_maintained: true
    derivative_only: true
    format: markdown
    claim_grounding: raw_only
    active_pages_must_validate: true
    structured_sidecar_dir: wiki/_meta
  schema:
    machine_enforced: true
    human_readable_contract: knowledge/AGENTS.md

operations:
  acquire:
    require_explicit_approval_ref: true
    require_trust_envelope: true
    verify_integrity_hash_when_present: true
    persist_raw_before_compile: true
    create_compile_proposal_only: true
  ingest:
    source_by_source_preferred: true
    create_trust_envelope_first: true
    update_index: true
    append_log: true
  query:
    read_index_first: true
    prefer_compiled_wiki: true
    raw_fallback_allowed: true
    file_answers_back_as: draft
  lint:
    check_orphans: true
    check_broken_links: true
    check_unknown_sources: true
    check_contradictions: true
    check_staleness: true
    structured_fact_key_conflicts: true
  semantic_projection:
    enabled: true
    markdown_remains_human_artifact: true
    reverse_dependency_stale_propagation: true
    stale_reality_anchors: true

technology_radar:
  statuses: [observed, triaged, sandbox_tested, probation, promoted, rejected]
  prefer_primitives_over_wrappers: true
  require_primary_artifact: true
  require_real_workload_test: true
  source_policy: config/technology-radar-sources.yaml
  promotion:
    min_probation_days: 14
    min_real_workload_passes: 2
    min_reality_anchor_count: 2
    rollback_required: true
    unresolved_failure_blocks: true
  no_auto_rewrite_of_current_stack: true

maintenance:
  hermes_cron_opt_in_env: FORGE_ENABLE_KNOWLEDGE_CRON
  lint:
    default_schedule: "17 6 * * *"
    no_agent: true
    queues_findings_to_kanban: true
  digest:
    default_schedule: "0 8 * * *"
    no_agent: true
  technology_radar:
    default_schedule: "15 7 * * 0"
    creates_triage_tasks_only: true
    may_not_adopt_or_promote: true

mcp:
  preferred_spec: "2026-07-28"
  stateless_remote_servers_preferred: true
  deprecated_features_for_new_code: [roots, sampling, logging, legacy_http_sse]
  tasks_extension_allowed_for_tool_long_running_work: true
  hermes_kanban_remains_execution_graph: true
  compiled_knowledge_worker_access: read_only
  acquisition_exposed_to_workers: false
  promotion_exposed_to_workers: false

security:
  untrusted_external_content_is_data_not_instructions: true
  wiki_compilation_does_not_grant_capabilities: true
  candidate_promotion_does_not_override_owner_charter: true
  raw_sources_never_execute: true
  shared_global_knowledge_public_only: true
  contradictions_fail_closed_to_review_or_stale: true
