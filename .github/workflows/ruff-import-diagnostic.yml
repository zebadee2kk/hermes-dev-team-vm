name: Ruff import diagnostic

on:
  push:
    branches: ["diag/ruff-import-order"]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - name: Show canonical import fix
        run: ruff check --select I --fix --diff src/forge_controller/knowledge_graph.py || true
